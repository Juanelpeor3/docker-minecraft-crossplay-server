spring.application.name=mcdashboard

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mcdashboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mcadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080

# RCON
rcon.host=${RCON_HOST:localhost}
rcon.port=${RCON_PORT:25575}
rcon.password=${RCON_PASSWORD:}

# JWT
jwt.secret=${JWT_SECRET:changeme}

# Admin credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}
