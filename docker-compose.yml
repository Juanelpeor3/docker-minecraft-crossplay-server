services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true

    ports:
      # Java Edition (TCP + UDP)
      - "25565:25565/tcp"
      - "25565:25565/udp"
      # Bedrock Edition (GeyserMC)
      - "19132:19132/udp"

    environment:
      # Server Core
      EULA: ${EULA:-TRUE}
      TYPE: PAPER
      MEMORY: ${MEMORY:-2G}

      # Server Properties
      SERVER_NAME: ${SERVER_NAME:-My Minecraft Server}
      MOTD: ${MOTD:-Crossplay Server}
      GAMEMODE: ${GAMEMODE:-survival}
      DIFFICULTY: ${DIFFICULTY:-normal}
      MAX_PLAYERS: ${MAX_PLAYERS:-20}
      ONLINE_MODE: ${ONLINE_MODE:-true}
      ENABLE_COMMAND_BLOCK: ${ENABLE_COMMAND_BLOCK:-true}
      SEED: ${SEED:-}
      PVP: ${PVP:-true}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-10}
      ENABLE_WHITELIST: ${ENABLE_WHITELIST:-false}
      WHITELIST: ${WHITELIST:-}

      # RCON
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?rcon password required}
      RCON_PORT: 25575

      # Plugins (direct download from GeyserMC build server)
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.12.0/PAPER/ViaVersion-5.12.0.jar

    volumes:
      - ./data:/data

    # Health check to monitor server status
    healthcheck:
      test: mc-health
      start_period: 2m
      interval: 30s
      retries: 6

    networks:
      - internal

  # Automatic Backups
  backups:
    image: itzg/mc-backup
    container_name: minecraft-backups
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy

    environment:
      # Backup interval (e.g., 2h, 30m)
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-2h}
      # How long to keep old backups
      PRUNE_BACKUPS_DAYS: ${PRUNE_BACKUPS_DAYS:-7}
      RCON_HOST: minecraft
      RCON_PASSWORD: ${RCON_PASSWORD}
      INITIAL_DELAY: 0

    volumes:
      - ./data:/data:ro
      - ./backups:/backups

    networks:
      - internal

  # Dashboard Database
  postgres:
    image: postgres:16-alpine
    container_name: minecraft-postgres
    restart: unless-stopped
    profiles: [dashboard]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcdashboard}
      POSTGRES_USER: ${POSTGRES_USER:-mcadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password required}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcadmin} -d ${POSTGRES_DB:-mcdashboard}"]
      interval: 10s
      retries: 5

  # Dashboard Backend
  backend:
    build: ./backend
    container_name: minecraft-backend
    restart: unless-stopped
    profiles: [dashboard]
    depends_on:
      postgres:
        condition: service_healthy
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PORT: 25575
      RCON_PASSWORD: ${RCON_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mcdashboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mcadmin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?jwt secret required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?admin password required}
    networks:
      - internal

  # Dashboard Frontend
  frontend:
    build: ./frontend
    container_name: minecraft-frontend
    restart: unless-stopped
    profiles: [dashboard]
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge
