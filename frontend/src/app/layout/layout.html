<div class="flex h-screen bg-mc-dark text-mc-text">
  <!-- Sidebar -->
  <aside class="w-64 bg-mc-panel border-r border-mc-border flex flex-col shrink-0">
    <div class="p-6 border-b border-mc-border">
      <h1 class="mc-title text-mc-green text-sm">MC Dashboard</h1>
      <p class="text-xs text-mc-gray mt-2">Minecraft Server Monitor</p>
    </div>

    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      @for (link of navLinks; track link.path) {
      @if (!link.adminOnly || auth.isAuthenticated()) {
      <a [routerLink]="link.path" routerLinkActive="bg-mc-surface text-mc-green border-l-2 border-mc-green"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-sm text-mc-gray hover:text-mc-text hover:bg-mc-surface/50 transition-colors duration-150 text-sm font-medium border-l-2 border-transparent">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="link.icon" />
        </svg>
        {{ link.label }}
      </a>
      }
      }
    </nav>

    <div class="p-3 border-t border-mc-border">
      @if (auth.isAuthenticated()) {
      <button (click)="auth.logout()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-sm text-mc-gray hover:text-mc-red hover:bg-mc-surface/50 transition-colors duration-150 text-sm font-medium text-left cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
        </svg>
        Cerrar sesion
      </button>
      } @else {
      <a routerLink="/login"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-sm text-mc-gray hover:text-mc-green hover:bg-mc-surface/50 transition-colors duration-150 text-sm font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
        </svg>
        Iniciar sesion
      </a>
      }
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto p-8 flex flex-col">
    <div class="flex-1">
      <router-outlet />
    </div>
    <app-footer class="mt-8" />
  </main>
</div>
