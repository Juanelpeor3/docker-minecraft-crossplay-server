<div class="animate-fade-in">
  <h2 class="mc-title text-mc-gold text-base mb-6">Jugadores</h2>

  <!-- Search -->
  <div class="mb-5">
    <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" placeholder="Buscar jugador..."
      class="mc-input w-full max-w-sm px-3 py-2.5 rounded-sm text-sm" />
  </div>

  <!-- Players Table -->
  <div class="mc-panel rounded-sm overflow-hidden">
    <table class="w-full">
      <thead>
        <tr class="border-b border-mc-border bg-mc-surface/50">
          <th class="px-5 py-3.5 text-left text-xs font-medium text-mc-gray uppercase tracking-wider">
            Nombre
          </th>
          <th class="px-5 py-3.5 text-left text-xs font-medium text-mc-gray uppercase tracking-wider">
            Plataforma
          </th>
          <th class="px-5 py-3.5 text-left text-xs font-medium text-mc-gray uppercase tracking-wider">
            Primera conexion
          </th>
          <th class="px-5 py-3.5"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-mc-border/50">
        @for (player of filteredPlayers(); track player.id) {
        <tr class="hover:bg-mc-surface/30 transition-colors duration-150">
          <td class="px-5 py-3.5 text-sm text-white font-medium">{{ player.name }}</td>
          <td class="px-5 py-3.5 text-sm">
            <span class="px-2 py-0.5 rounded-sm text-xs font-medium border" [class]="
                  player.platform === 'BEDROCK'
                    ? 'bg-mc-aqua/10 text-mc-aqua border-mc-aqua/20'
                    : 'bg-mc-gold/10 text-mc-gold border-mc-gold/20'
                ">
              {{ player.platform }}
            </span>
          </td>
          <td class="px-5 py-3.5 text-sm text-mc-gray">
            {{ player.firstSeen | date: 'dd/MM/yyyy HH:mm' }}
          </td>
          <td class="px-5 py-3.5 text-sm text-right">
            <a [routerLink]="['/players', player.id]"
              class="text-mc-aqua hover:text-mc-green transition-colors duration-150">
              Ver detalle
            </a>
          </td>
        </tr>
        } @empty {
        <tr>
          <td colspan="4" class="px-5 py-12 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1"
              stroke="currentColor" class="w-10 h-10 text-mc-border-light mx-auto mb-2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
            <p class="text-mc-gray text-sm">No se encontraron jugadores</p>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
